name: MetaCall Examples CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - master

env:
  PYTHON_VERSION: 3.12

jobs:
  test:
    name: Test
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        env: [cli, faas]
        os: [ubuntu-latest, windows-latest, macos-14, macos-15, macos-15-intel]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install MetaCall (Unix)
        if: matrix.os != 'windows-latest'
        run: curl -sL https://raw.githubusercontent.com/metacall/install/master/install.sh | sh

      - name: Install MetaCall (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          powershell -NoProfile -ExecutionPolicy unrestricted -Command "[Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12; &([scriptblock]::Create((Invoke-WebRequest -UseBasicParsing 'https://raw.githubusercontent.com/metacall/install/master/install.ps1')))"
          echo C:\Users\runneradmin\AppData\Local\MetaCall >> $env:GITHUB_PATH
        shell: powershell

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Test Suits
        if: matrix.os != 'windows-latest'
        shell: bash
        run: |
          if [ "${{ matrix.env }}" == "faas" ]; then
            metacall faas &
            sleep 5  # Wait for the server to start
          fi
          find test-suites -type f -name "*.yaml" -exec python ./testing.py -f {} -V -e ${{ matrix.env }} \;

      - name: Run Test Suite (Windows)
        if: matrix.os == 'windows-latest'
        shell: powershell
        env:
          MATRIX_ENV: ${{ matrix.env }}
        run: |
          python testing.py -f test-suites/test-time-app-web.yaml -V -e $env:MATRIX_ENV
